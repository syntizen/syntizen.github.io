<body>

<div class="wrap">

  </div>

</div>


<script>

/* ============================================================
   STAGE FORMAT

   # = wall
   space = floor
   . = target
   X = box
   P = player
   ============================================================ */


/*
   These stages are deliberately much more constrained than
   the previous version.

   The difficulty comes from:

   - narrow corridors
   - dead-end pockets
   - forced box ordering
   - temporary displacement
   - bottlenecks
   - boxes blocking player routes
   - target access from only one direction
*/


const STAGES = [

/* ============================================================
   STAGE 1 — THE FIRST TRAP
   ============================================================ */

{
  name: "The First Trap",
  difficulty: "★★★☆☆  HARD",

  map: [
    "#########",
    "#   .   #",
    "# ###X# #",
    "#  X   .#",
    "# # ### #",
    "# .X   X#",
    "#   P   #",
    "#########"
  ]
},


/* ============================================================
   STAGE 2 — FALSE TARGET
   ============================================================ */

{
  name: "False Target",
  difficulty: "★★★★☆  VERY HARD",

  map: [
    "##########",
    "# .      #",
    "# ###X## #",
    "#   X    #",
    "### ###. #",
    "# X   X  #",
    "#   P  . #",
    "##########"
  ]
},


/* ============================================================
   STAGE 3 — ONE WAY
   ============================================================ */

{
  name: "One Way",
  difficulty: "★★★★☆  VERY HARD",

  map: [
    "###########",
    "# .   #   #",
    "# ### # X #",
    "#   X   . #",
    "# # ##### #",
    "# # X     #",
    "# .   P   #",
    "###########"
  ]
},


/* ============================================================
   STAGE 4 — BOTTLENECK
   ============================================================ */

{
  name: "Bottleneck",
  difficulty: "★★★★☆  VERY HARD",

  map: [
    "###########",
    "# .   # . #",
    "# ### X # #",
    "#   X   # #",
    "### ###   #",
    "# X   X   #",
    "# .   P   #",
    "###########"
  ]
},


/* ============================================================
   STAGE 5 — REVERSE THINKING
   ============================================================ */

{
  name: "Reverse Thinking",
  difficulty: "★★★★★  EXTREME",

  map: [
    "############",
    "# .   #   .#",
    "# ### X ### #".replace(" ", ""),
    "#   X      #",
    "### ###### #",
    "# X     X  #",
    "# .  P     #",
    "############"
  ]
},


/* ============================================================
   STAGE 6 — THE LOCK
   ============================================================ */

{
  name: "The Lock",
  difficulty: "★★★★★  EXTREME",

  map: [
    "############",
    "# .   #   .#",
    "# ### X ### #".replace(" ", ""),
    "# X       X#",
    "# # ##### #",
    "# #   X   #",
    "# .   P   #",
    "############"
  ]
},


/* ============================================================
   STAGE 7 — THREE DEPENDENCIES
   ============================================================ */

{
  name: "Three Dependencies",
  difficulty: "★★★★★  EXTREME",

  map: [
    "#############",
    "# .   #   . #",
    "# ### X ### #",
    "#   X   X   #",
    "### ##### ###",
    "# X       X #",
    "# .   P   . #",
    "#############"
  ]
},


/* ============================================================
   STAGE 8 — DEADLOCK CITY
   ============================================================ */

{
  name: "Deadlock City",
  difficulty: "★★★★★  EXTREME",

  map: [
    "#############",
    "# .     # . #",
    "# ### X # X #",
    "#   X     X #",
    "### ### ### #",
    "# X   X     #",
    "# .   P   . #",
    "#############"
  ]
},


/* ============================================================
   STAGE 9 — NO WASTED PUSH
   ============================================================ */

{
  name: "No Wasted Push",
  difficulty: "★★★★★  MASTER",

  map: [
    "##############",
    "# .    #    .#",
    "# ###X # X### #".replace(" ", ""),
    "#   X     X   #",
    "### ####### ###",
    "# X         X #",
    "# .    P    . #",
    "##############"
  ]
},


/* ============================================================
   STAGE 10 — IQ 150
   ============================================================ */

{
  name: "The Grandmaster",
  difficulty: "★★★★★  IQ 150+",

  map: [
    "###############",
    "# .   #   #   .#",
    "# ### X # X ### #".replace(" ", ""),
    "#   X     X     #",
    "### ### ### ### #".replace(" ", ""),
    "# X     X     X #",
    "# .   P     .   #",
    "###############"
  ]
}

];


/* ============================================================
   GAME STATE
   ============================================================ */

let stageIndex = 0;

let map = [];

let width = 0;

let height = 0;

let walls = new Set();

let targets = new Set();

let boxes = [];

let player = {
  x: 0,
  y: 0
};

let initialState = null;

let history = [];

let moves = 0;

let pushes = 0;

let solved = false;


/* ============================================================
   PARSE STAGE
   ============================================================ */

function parseStage(stage) {

  map = stage.map;

  height = map.length;

  width = Math.max(
    ...map.map(row => row.length)
  );

  walls = new Set();

  targets = new Set();

  boxes = [];

  player = {
    x: 0,
    y: 0
  };


  for (let y = 0; y < height; y++) {

    const row =
      map[y].padEnd(width, "#");


    for (let x = 0; x < width; x++) {

      const tile = row[x];

      const k = key(x, y);


      if (tile === "#") {

        walls.add(k);

      }


      else if (tile === ".") {

        targets.add(k);

      }


      else if (tile === "X") {

        boxes.push({
          x,
          y
        });

      }


      else if (tile === "P") {

        player = {
          x,
          y
        };

      }

    }

  }

}


/* ============================================================
   UTILITIES
   ============================================================ */

function key(x, y) {

  return `${x},${y}`;

}


function boxAt(x, y) {

  return boxes.findIndex(
    b =>
      b.x === x &&
      b.y === y
  );

}


function isWall(x, y) {

  return walls.has(
    key(x, y)
  );

}


function isFree(x, y) {

  return (
    x >= 0 &&
    x < width &&
    y >= 0 &&
    y < height &&
    !isWall(x, y)
  );

}


/* ============================================================
   SAVE STATE
   ============================================================ */

function saveState() {

  history.push({
    player: {
      x: player.x,
      y: player.y
    },

    boxes: boxes.map(b => ({
      x: b.x,
      y: b.y
    })),

    moves,
    pushes
  });

}


/* ============================================================
   RESTORE STATE
   ============================================================ */

function restoreState(state) {

  player = {
    x: state.player.x,
    y: state.player.y
  };

  boxes =
    state.boxes.map(b => ({
      x: b.x,
      y: b.y
    }));

  moves = state.moves;

  pushes = state.pushes;

  solved = false;

  document.getElementById(
    "nextButton"
  ).style.display = "none";

  draw();

}


/* ============================================================
   UNDO
   ============================================================ */

function undo() {

  if (!history.length) {
    return;
  }

  restoreState(
    history.pop()
  );

}


/* ============================================================
   MOVE
   ============================================================ */

function move(dx, dy) {

  if (solved) {
    return;
  }


  const nx =
    player.x + dx;

  const ny =
    player.y + dy;


  if (!isFree(nx, ny)) {
    return;
  }


  const box =
    boxAt(nx, ny);


  /* ----------------------------------------------------------
     NORMAL WALK
     ---------------------------------------------------------- */

  if (box === -1) {

    saveState();

    player.x = nx;

    player.y = ny;

    moves++;

    draw();

    return;

  }


  /* ----------------------------------------------------------
     PUSH
     ---------------------------------------------------------- */

  const bx =
    nx + dx;

  const by =
    ny + dy;


  if (!isFree(bx, by)) {
    return;
  }


  if (boxAt(bx, by) !== -1) {
    return;
  }


  saveState();


  boxes[box].x = bx;

  boxes[box].y = by;


  player.x = nx;

  player.y = ny;


  moves++;

  pushes++;


  draw();

  checkSolved();

}


/* ============================================================
   WIN CHECK
   ============================================================ */

function checkSolved() {

  if (!boxes.length) {
    return;
  }


  const win =
    boxes.every(
      box =>
        targets.has(
          key(box.x, box.y)
        )
    );


  if (!win) {
    return;
  }


  solved = true;


  let message =
    `🎉 Stage ${stageIndex + 1} Complete!`;


  if (
    pushes <=
    optimalPushEstimate()
  ) {

    message +=
      "  🔥 Excellent solution!";

  }


  document.getElementById(
    "status"
  ).textContent = message;


  document.getElementById(
    "nextButton"
  ).style.display =
    "inline-block";


  if (
    stageIndex ===
    STAGES.length - 1
  ) {

    document.getElementById(
      "nextButton"
    ).textContent =
      "🏆 Play Again";

  }

}


/* ============================================================
   PUSH ESTIMATE

   This is intentionally not presented as a mathematically
   proven minimum. It is a benchmark for scoring.
   ============================================================ */

function optimalPushEstimate() {

  const estimates = [
    22,
    30,
    38,
    46,
    58,
    70,
    82,
    95,
    115,
    140
  ];

  return estimates[stageIndex];

}


/* ============================================================
   LOAD STAGE
   ============================================================ */

function loadStage(index) {

  stageIndex = index;

  parseStage(
    STAGES[stageIndex]
  );


  moves = 0;

  pushes = 0;

  history = [];

  solved = false;


  initialState = {
    player: {
      x: player.x,
      y: player.y
    },

    boxes: boxes.map(b => ({
      x: b.x,
      y: b.y
    }))
  };


  document.getElementById(
    "stageSelect"
  ).value = stageIndex;


  document.getElementById(
    "status"
  ).textContent =
    `Stage ${stageIndex + 1}: ${STAGES[stageIndex].name}`;


  document.getElementById(
    "difficulty"
  ).textContent =
    STAGES[stageIndex].difficulty;


  document.getElementById(
    "nextButton"
  ).style.display =
    "none";


  draw();

}


/* ============================================================
   RESTART
   ============================================================ */

function restartStage() {

  loadStage(stageIndex);

}


/* ============================================================
   NEXT
   ============================================================ */

function nextStage() {

  if (
    stageIndex <
    STAGES.length - 1
  ) {

    loadStage(
      stageIndex + 1
    );

  }

  else {

    loadStage(0);

  }

}


/* ============================================================
   DRAW
   ============================================================ */

function draw() {

  const game =
    document.getElementById(
      "game"
    );


  game.innerHTML = "";


  game.style.gridTemplateColumns =
    `repeat(${width}, var(--s))`;


  game.style.gridTemplateRows =
    `repeat(${height}, var(--s))`;


  for (
    let y = 0;
    y < height;
    y++
  ) {

    for (
      let x = 0;
      x < width;
      x++
    ) {

      const cell =
        document.createElement(
          "div"
        );


      cell.className =
        "cell";


      const k =
        key(x, y);


      /* ------------------------------------------------------
         WALL
         ------------------------------------------------------ */

      if (
        walls.has(k)
      ) {

        cell.classList.add(
          "wall"
        );

      }


      /* ------------------------------------------------------
         FLOOR
         ------------------------------------------------------ */

      else {

        cell.classList.add(
          "floor"
        );


        /* Target */

        if (
          targets.has(k)
        ) {

          cell.classList.add(
            "target"
          );

          cell.textContent =
            "○";

        }


        /* Box */

        const bi =
          boxAt(x, y);


        if (bi !== -1) {

          cell.classList.add(
            "box"
          );


          if (
            targets.has(k)
          ) {

            cell.classList.add(
              "done"
            );

          }


          cell.textContent =
            "×";

        }


        /* Player */

        if (
          player.x === x &&
          player.y === y
        ) {

          cell.classList.add(
            "player"
          );

        }

      }


      game.appendChild(
        cell
      );

    }

  }


  document.getElementById(
    "moves"
  ).textContent =
    moves;


  document.getElementById(
    "pushes"
  ).textContent =
    pushes;

}


/* ============================================================
   BUILD STAGE SELECT
   ============================================================ */

function buildStageSelect() {

  const select =
    document.getElementById(
      "stageSelect"
    );


  STAGES.forEach(
    (stage, index) => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        index;


      option.textContent =
        `Stage ${index + 1} — ${stage.name}`;


      select.appendChild(
        option
      );

    }
  );

}


/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener(
  "keydown",
  event => {

    const keyName =
      event.key.toLowerCase();


    const controlledKeys = [
      "arrowup",
      "arrowdown",
      "arrowleft",
      "arrowright",
      "w",
      "a",
      "s",
      "d",
      "r",
      "z"
    ];


    if (
      controlledKeys.includes(
        keyName
      )
    ) {

      event.preventDefault();

    }


    if (
      keyName === "r"
    ) {

      restartStage();

    }


    else if (
      keyName === "z"
    ) {

      undo();

    }


    else if (
      keyName === "arrowup" ||
      keyName === "w"
    ) {

      move(0, -1);

    }


    else if (
      keyName === "arrowdown" ||
      keyName === "s"
    ) {

      move(0, 1);

    }


    else if (
      keyName === "arrowleft" ||
      keyName === "a"
    ) {

      move(-1, 0);

    }


    else if (
      keyName === "arrowright" ||
      keyName === "d"
    ) {

      move(1, 0);

    }

  }
);


/* ============================================================
   START
   ============================================================ */

buildStageSelect();

loadStage(0);

</script>

</body>
</html>
