<body>

<div class="wrap">

  <h1>Push X to O</h1>

  <!-- Stage selector -->
  <select id="stageSelect"
          onchange="selectStage(this.value)">
  </select>

  <!-- Game board -->
  <div id="game"></div>

  <!-- Status -->
  <div id="status"></div>

  <!-- Controls -->
  <button onclick="reset()">Restart</button>

  <button id="nextBtn"
          onclick="nextStage()"
          style="display:none;">
    Next Stage →
  </button>

  <div class="controls">
    Arrow keys / WASD · R = restart · Z = undo
  </div>

</div>


<script>

/* ============================================================
   PUSH X TO O
   10 STAGES
   ============================================================ */

const LEVELS = [

  /* ----------------------------------------------------------
     STAGE 1
     ---------------------------------------------------------- */

  {
    name: "First Push",

    width: 5,
    height: 8,

    player: [1, 3],

    boxes: [

      [2, 3],
      [2, 4],

    ],

    ]
  },


  /* ----------------------------------------------------------

     ---------------------------------------------------------- */

  {

    width: 7,
    height: 8,

    player: [1, 6],

    boxes: [

    ],

      [4, 1],
      [2, 6],

    ]
  },


  /* ----------------------------------------------------------

     ---------------------------------------------------------- */

  {

    player: [1, 6],

    boxes: [
      [2, 2],

    ],

      [2, 1],
      [4, 1],
      [5, 6],

    ]
  },


  /* ----------------------------------------------------------
     STAGE 4
     ---------------------------------------------------------- */

  {
    name: "Crossroads",

    width: 9,
    height: 9,

    boxes: [
      [3, 2],
      [5, 2],
      [3, 5],
      [5, 5]
    ],

    targets: [
      [2, 1],
      [6, 1],
      [2, 7],

    ]
  },


  /* ----------------------------------------------------------
     STAGE 5
     ---------------------------------------------------------- */

  {
    name: "Narrow Passage",

    width: 9,
    height: 9,

    player: [1, 7],

    boxes: [
      [3, 2],
      [4, 3],
      [5, 4],
      [4, 5]
    ],

    targets: [
      [2, 1],
      [6, 1],
      [2, 7],

    ]
  },


  /* ----------------------------------------------------------
     STAGE 6
     ---------------------------------------------------------- */

  {
    name: "Spiral",

    width: 10,
    height: 10,

    player: [1, 8],

    boxes: [
      [3, 2],
      [6, 2],
      [3, 6],
      [6, 6]
    ],

    targets: [
      [2, 1],
      [7, 1],
      [2, 8],
      [7, 8]
    ]
  },


  /* ----------------------------------------------------------
     STAGE 7
     ---------------------------------------------------------- */

  {
    name: "Four Corners",

    width: 10,
    height: 10,

    player: [1, 8],

    boxes: [
      [3, 2],

    ]
  },


  /* ----------------------------------------------------------

  {

    boxes: [

    ],

    targets: [

      [7, 1],
      [2, 8],
      [7, 8]
    ]
  },


  /* ----------------------------------------------------------
     STAGE 9
     ---------------------------------------------------------- */

  {
    name: "Traffic",

    width: 11,
    height: 10,

    player: [1, 8],

    boxes: [
      [3, 2],
      [5, 2],
      [7, 2],
      [4, 6],
      [6, 6]
    ],

    targets: [
      [2, 1],
      [4, 1],
      [6, 1],
      [8, 1],
      [5, 8]
    ]
  },


  /* ----------------------------------------------------------
     STAGE 10
     ---------------------------------------------------------- */

  {
    name: "The Final Push",

    width: 11,
    height: 11,

    player: [1, 9],

    boxes: [
      [3, 2],
      [5, 2],
      [7, 2],
      [3, 6],
      [5, 6],
      [7, 6]
    ],

    targets: [
      [2, 1],
      [4, 1],
      [6, 1],
      [8, 1],
      [4, 9],
      [7, 9]
    ]
  }

];


/* ============================================================
   GAME STATE
   ============================================================ */

let levelIndex = 0;

let player;

let boxes;

let targets;

let walls;

let history;

let solved = false;


/* ============================================================
   UTILITY
   ============================================================ */

function key(x, y) {
  return `${x},${y}`;
}


/* ============================================================
   STAGE SELECTOR
   ============================================================ */

function buildStageSelect() {

  const select =
    document.getElementById("stageSelect");

  select.innerHTML = "";

  LEVELS.forEach((level, i) => {

    const option =
      document.createElement("option");

    option.value = i;

    option.textContent =
      `Stage ${i + 1} — ${level.name}`;

    select.appendChild(option);

  });

  select.value = levelIndex;
}


/* ============================================================
   LOAD STAGE
   ============================================================ */

function loadLevel(index) {

  levelIndex = Number(index);

  const level = LEVELS[levelIndex];

  walls = new Set();

  targets = new Set();


  /* ----------------------------------------------------------
     Outer walls
     ---------------------------------------------------------- */

  for (
    let y = 0;
    y < level.height;
    y++
  ) {

    for (
      let x = 0;
      x < level.width;
      x++
    ) {

      if (
        x === 0 ||
        x === level.width - 1 ||
        y === 0 ||
        y === level.height - 1
      ) {

        walls.add(key(x, y));

      }

    }

  }


  /* ----------------------------------------------------------
     Targets
     ---------------------------------------------------------- */

  for (const [x, y] of level.targets) {

    targets.add(key(x, y));

  }


  /* ----------------------------------------------------------
     Player
     ---------------------------------------------------------- */

  player = {
    x: level.player[0],
    y: level.player[1]
  };


  /* ----------------------------------------------------------
     Boxes
     ---------------------------------------------------------- */

  boxes =
    level.boxes.map(([x, y]) => ({
      x,
      y
    }));


  history = [];

  solved = false;


  /* ----------------------------------------------------------
     UI
     ---------------------------------------------------------- */

  document.getElementById(
    "stageSelect"
  ).value = levelIndex;

  document.getElementById(
    "status"
  ).textContent =
    `Stage ${levelIndex + 1}: ${level.name}`;

  document.getElementById(
    "nextBtn"
  ).style.display = "none";


  draw();
}


/* ============================================================
   CHANGE STAGE
   ============================================================ */

function selectStage(index) {

  loadLevel(index);

}


/* ============================================================
   FIND BOX
   ============================================================ */

function boxAt(x, y) {

  return boxes.findIndex(
    b =>
      b.x === x &&
      b.y === y
  );

}


/* ============================================================
   CHECK WALKABLE
   ============================================================ */

function walkable(x, y) {

  const level =
    LEVELS[levelIndex];

  return (
    x >= 0 &&
    x < level.width &&
    y >= 0 &&
    y < level.height &&
    !walls.has(key(x, y))
  );

}


/* ============================================================
   SAVE STATE
   ============================================================ */

function save() {

  history.push(
    JSON.stringify({
      player,
      boxes
    })
  );

}


/* ============================================================
   UNDO
   ============================================================ */

function undo() {

  if (!history.length) {
    return;
  }

  const state =
    JSON.parse(
      history.pop()
    );

  player = state.player;

  boxes = state.boxes;

  solved = false;


  document.getElementById(
    "status"
  ).textContent =
    `Stage ${levelIndex + 1}: ${LEVELS[levelIndex].name}`;


  document.getElementById(
    "nextBtn"
  ).style.display = "none";


  draw();

}


/* ============================================================
   MOVE PLAYER
   ============================================================ */

function move(dx, dy) {

  if (solved) {
    return;
  }


  const nx =
    player.x + dx;

  const ny =
    player.y + dy;


  /* ----------------------------------------------------------
     Can't walk into wall
     ---------------------------------------------------------- */

  if (!walkable(nx, ny)) {
    return;
  }


  const i =
    boxAt(nx, ny);


  /* ----------------------------------------------------------
     Normal movement
     ---------------------------------------------------------- */

  if (i < 0) {

    save();

    player = {
      x: nx,
      y: ny
    };

    draw();

    return;
  }


  /* ----------------------------------------------------------
     Push box
     ---------------------------------------------------------- */

  const bx =
    nx + dx;

  const by =
    ny + dy;


  /* Can't push outside board */
  if (!walkable(bx, by)) {
    return;
  }


  /* Can't push two boxes */
  if (boxAt(bx, by) >= 0) {
    return;
  }


  save();


  boxes[i] = {
    x: bx,
    y: by
  };


  player = {
    x: nx,
    y: ny
  };


  draw();

  checkSolved();

}


/* ============================================================
   CHECK WIN
   ============================================================ */

function checkSolved() {

  if (
    boxes.length > 0 &&
    boxes.every(
      b =>
        targets.has(
          key(b.x, b.y)
        )
    )
  ) {

    solved = true;


    if (
      levelIndex <
      LEVELS.length - 1
    ) {

      document.getElementById(
        "status"
      ).textContent =
        `🎉 Stage ${levelIndex + 1} Complete!`;

      document.getElementById(
        "nextBtn"
      ).style.display =
        "inline-block";

      document.getElementById(
        "nextBtn"
      ).textContent =
        "Next Stage →";

    }

    else {

      document.getElementById(
        "status"
      ).textContent =
        "🏆 Congratulations! You completed all 10 stages!";

      document.getElementById(
        "nextBtn"
      ).style.display =
        "inline-block";

      document.getElementById(
        "nextBtn"
      ).textContent =
        "Play Again";

    }

  }

}


/* ============================================================
   NEXT STAGE
   ============================================================ */

function nextStage() {

  if (
    levelIndex <
    LEVELS.length - 1
  ) {

    loadLevel(
      levelIndex + 1
    );

  }

  else {

    loadLevel(0);

  }

}


/* ============================================================
   RESTART CURRENT STAGE
   ============================================================ */

function reset() {

  loadLevel(
    levelIndex
  );

}


/* ============================================================
   DRAW BOARD
   ============================================================ */

function draw() {

  const game =
    document.getElementById(
      "game"
    );

  const level =
    LEVELS[levelIndex];


  game.innerHTML = "";


  /* Dynamic board size */

  game.style.gridTemplateColumns =
    `repeat(${level.width}, var(--s))`;

  game.style.gridTemplateRows =
    `repeat(${level.height}, var(--s))`;


  /* ----------------------------------------------------------
     Create cells
     ---------------------------------------------------------- */

  for (
    let y = 0;
    y < level.height;
    y++
  ) {

    for (
      let x = 0;
      x < level.width;
      x++
    ) {

      const c =
        document.createElement("div");

      c.className =
        "cell";


      /* ------------------------------------------------------
         Wall
         ------------------------------------------------------ */

      if (
        walls.has(
          key(x, y)
        )
      ) {

        c.classList.add(
          "wall"
        );

      }


      /* ------------------------------------------------------
         Floor
         ------------------------------------------------------ */

      else {

        c.classList.add(
          "floor"
        );


        /* Center column */

        if (
          x ===
          Math.floor(
            level.width / 2
          )
        ) {

          c.classList.add(
            "center"
          );

        }


        /* ----------------------------------------------------
           Target
           ---------------------------------------------------- */

        if (
          targets.has(
            key(x, y)
          )
        ) {

          c.classList.add(
            "target"
          );

          c.textContent =
            "○";

        }


        /* ----------------------------------------------------
           Box
           ---------------------------------------------------- */

        const bi =
          boxAt(x, y);


        if (bi >= 0) {

          c.classList.add(
            "box"
          );


          if (
            targets.has(
              key(x, y)
            )
          ) {

            c.classList.add(
              "done"
            );

          }


          c.textContent =
            "×";

        }


        /* ----------------------------------------------------
           Player
           ---------------------------------------------------- */

        if (
          player.x === x &&
          player.y === y
        ) {

          c.classList.add(
            "player"
          );

        }

      }


      game.appendChild(c);

    }

  }

}


/* ============================================================
   KEYBOARD CONTROLS
   ============================================================ */

document.addEventListener(
  "keydown",
  e => {

    const k =
      e.key.toLowerCase();


    const controls = [
      "arrowup",
      "arrowdown",
      "arrowleft",
      "arrowright",
      " ",
      "w",
      "a",
      "s",
      "d",
      "r",
      "z"
    ];


    if (
      controls.includes(k)
    ) {

      e.preventDefault();

    }


    /* Restart */

    if (k === "r") {

      reset();

    }


    /* Undo */

    else if (k === "z") {

      undo();

    }


    /* Up */

    else if (
      k === "arrowup" ||
      k === "w"
    ) {

      move(0, -1);

    }


    /* Down */

    else if (
      k === "arrowdown" ||
      k === "s"
    ) {

      move(0, 1);

    }


    /* Left */

    else if (
      k === "arrowleft" ||
      k === "a"
    ) {

      move(-1, 0);

    }


    /* Right */

    else if (
      k === "arrowright" ||
      k === "d"
    ) {

      move(1, 0);

    }

  }
);


/* ============================================================
   START GAME
   ============================================================ */

buildStageSelect();

loadLevel(0);

</script>

</body>
</html>
